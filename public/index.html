<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ Cute Video Call</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- User Profile Section (shown when authenticated) -->
  <div id="userProfile" class="user-profile" style="display: none;">
    <div class="user-info">
      <span id="userName"></span>
    </div>
    <button id="signOutBtn" class="btn-signout">Sign Out 👋</button>
  </div>

  <div class="container">
    <!-- Authentication Section -->
    <div id="authSection" class="auth-card">
      <div class="card-header">
        <h1>✨ Cute Video Call ✨</h1>
        <p class="subtitle">Create an account or login to start calling!</p>
      </div>

      <!-- Auth Tabs -->
      <div class="auth-tabs">
        <button id="signupTab" class="auth-tab active">Sign Up</button>
        <button id="loginTab" class="auth-tab">Login</button>
      </div>

      <!-- Signup Form -->
      <form id="signupForm" class="auth-form active">
        <div class="form-group">
          <label for="signupEmail">
            <span class="emoji">📧</span> Email
          </label>
          <input type="email" id="signupEmail" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
          <label for="signupPassword">
            <span class="emoji">🔒</span> Password
          </label>
          <input type="password" id="signupPassword" placeholder="Enter password (min 6 chars)" required minlength="6">
        </div>

        <div class="form-group">
          <label for="signupUsername">
            <span class="emoji">💖</span> Username
          </label>
          <input type="text" id="signupUsername" placeholder="Your cute name..." required maxlength="20">
        </div>

        <div class="form-group">
          <label>
            <span class="emoji">🎨</span> Choose Your Avatar
          </label>
          <div class="avatar-selector">
            <div class="avatar-option" data-avatar="cat">
              <div class="avatar-circle avatar-cat">🐱</div>
              <span>Cat</span>
            </div>
            <div class="avatar-option" data-avatar="bunny">
              <div class="avatar-circle avatar-bunny">🐰</div>
              <span>Bunny</span>
            </div>
            <div class="avatar-option" data-avatar="bear">
              <div class="avatar-circle avatar-bear">🐻</div>
              <span>Bear</span>
            </div>
            <div class="avatar-option" data-avatar="panda">
              <div class="avatar-circle avatar-panda">🐼</div>
              <span>Panda</span>
            </div>
            <div class="avatar-option" data-avatar="fox">
              <div class="avatar-circle avatar-fox">🦊</div>
              <span>Fox</span>
            </div>
            <div class="avatar-option selected" data-avatar="star">
              <div class="avatar-circle avatar-star">⭐</div>
              <span>Star</span>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-join">
          <span>Sign Up</span>
          <span class="btn-emoji">🎉</span>
        </button>
      </form>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="loginEmail">
            <span class="emoji">📧</span> Email
          </label>
          <input type="email" id="loginEmail" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">
            <span class="emoji">🔒</span> Password
          </label>
          <input type="password" id="loginPassword" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn-join">
          <span>Login</span>
          <span class="btn-emoji">🚀</span>
        </button>
      </form>
    </div>

    <!-- Room Join Section (shown after authentication) -->
    <div id="roomSection" class="welcome-card" style="display: none;">
      <div class="card-header">
        <h1>✨ Join a Room ✨</h1>
        <p class="subtitle">Enter a room code to start your video call!</p>
      </div>

      <form id="joinForm" class="join-form">
        <div class="form-group">
          <label for="roomCode">
            <span class="emoji">🏠</span> Room Code
          </label>
          <input type="text" id="roomCode" placeholder="e.g., cutie123" required maxlength="20">
        </div>

        <button type="submit" class="btn-join">
          <span>Join Room</span>
          <span class="btn-emoji">🎉</span>
        </button>
      </form>

      <div class="info-text">
        <p>💡 <strong>Tip:</strong> Share the same room code with friends to video call together!</p>
      </div>
    </div>
  </div>

  <!-- Load Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Load Auth Script -->
  <script src="/js/auth.js"></script>
  <!-- Load Main Script -->
  <script src="/js/main.js"></script>
</body>

</html>
